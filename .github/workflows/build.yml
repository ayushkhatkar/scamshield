name: Build APK

# Builds a debug APK on every push and on manual run, and uploads it as a
# downloadable artifact. Debug builds skip the release lint gate, so this is
# the quickest path to an installable file.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run engine unit tests
        run: ./gradlew :engine:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scamshield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
