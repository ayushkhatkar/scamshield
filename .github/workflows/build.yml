name: Build APK

# Builds a debug APK on every push and on manual run, and uploads it as a
# downloadable artifact. Debug builds skip the release lint gate, so this is
# the quickest path to an installable file.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK as a Release asset
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete "tools"
          # package, which sdkmanager can no longer find and which aborts the
          # step. Pin exactly what compileSdk 35 needs instead.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run engine unit tests
        run: ./gradlew :engine:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scamshield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish a directly-installable .apk to the "latest" release (main only),
      # so there is a permanent one-tap download link that needs no unzipping.
      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          body: Debug APK built automatically from the latest commit on main.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
